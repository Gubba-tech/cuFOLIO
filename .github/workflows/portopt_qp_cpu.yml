name: PortOpt QP CPU

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  qp-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run python -m compileall -q src tests scripts examples
      - run: uv run pytest tests/test_qp_examples_smoke.py -q
      - run: uv run pytest -m "not gpu" -q
